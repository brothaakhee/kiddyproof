# kiddyproof-edge — the two paths that need real measurement.
#
#   /appcast.xml   every installed copy fetches this via Sparkle (~daily), so
#                  counting unique requesters = active installs. Passed through
#                  to the Railway origin untouched; only observed.
#   /download      the marketing download. Logged (OS, bot, source, referrer)
#                  then 302'd to the GitHub asset. The site never links GitHub
#                  directly any more, so GitHub's counter can be ignored.
#
# Routes only fire once the DNS records are proxied through Cloudflare.
# Until then the origin serves both paths itself (site/download/index.html is
# a meta-refresh fallback), so nothing breaks in either state.

name = "kiddyproof-edge"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ORIGIN_HOST = "kiddyproof.app"
FROM_ADDRESS = "kiddyproof <hello@kiddyproof.app>"
REPLY_TO = "hello@kiddyproof.app"

# Secrets (wrangler secret put): HASH_PEPPER, RESEND_API_KEY.
# Without RESEND_API_KEY, POST /send-link answers 503 "unavailable" and the
# page falls back to a self-addressed mailto — nothing breaks, nothing sends.

# Per-recipient throttle for /send-link: one message per address per day.
# Keys are peppered hashes; the namespace never holds an email address.
[[kv_namespaces]]
binding = "SENT"
id = "ac1700560c514062b1edfc882b179eab"

# Per-IP throttle for /send-link. period must be 10 or 60.
[[ratelimits]]
name = "SEND_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret, set once with:  openssl rand -hex 32 | npx wrangler secret put HASH_PEPPER
# Peppers the install-id hash so IPs cannot be recovered from the dataset.
# (HASH_PEPPER is a secret, not a var — listed here only for discoverability.)

[[analytics_engine_datasets]]
binding = "STATS"
dataset = "kiddyproof_stats"

[[routes]]
pattern = "kiddyproof.app/appcast.xml"
zone_name = "kiddyproof.app"

[[routes]]
# download* (not /download + /download/*): an exact pattern does not match
# when a query string is present, and the site links /download?src=...
pattern = "kiddyproof.app/download*"
zone_name = "kiddyproof.app"

[[routes]]
pattern = "kiddyproof.app/send-link"
zone_name = "kiddyproof.app"

[[routes]]
pattern = "www.kiddyproof.app/appcast.xml"
zone_name = "kiddyproof.app"

[[routes]]
pattern = "www.kiddyproof.app/send-link"
zone_name = "kiddyproof.app"

[[routes]]
# download* (not /download + /download/*): an exact pattern does not match
# when a query string is present, and the site links /download?src=...
pattern = "www.kiddyproof.app/download*"
zone_name = "kiddyproof.app"
